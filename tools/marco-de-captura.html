<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marco de captura — el sitio a un ancho de verdad</title>

<!--
  PARA QUÉ EXISTE ESTE ARCHIVO, y no es un capricho.

  Chrome tiene un ANCHO MÍNIMO DE VENTANA de 500 px: se le pide
  `--window-size=390` y abre 500. Medido el 25-sep-2026 y confirmado el 28:
  `--headless=new` recorta la CAPTURA a 390 pero la ventana sigue midiendo
  500, así que la foto sale de 390 px de ancho mostrando una página maquetada
  para 500. Es peor que un error: es una foto creíble de otra cosa.

  Con los TABLEROS no molestaba, porque el generador les clava el ancho y
  aplana las media queries: su dibujo no depende de la ventana. El SITIO sí
  depende — sus media queries son de verdad—, así que hace falta un viewport
  real de 390.

  Un <iframe> ES un viewport. Adentro, `innerWidth` mide 390 y las media
  queries resuelven contra eso. Verificado, no supuesto.

  CÓMO SE USA (el servidor tiene que estar levantado en la raíz del repo):

      python3 -m http.server 8000
      chrome --headless=new --window-size=600,<ALTO> \
             --screenshot=<SALIDA>.png \
             "http://localhost:8000/tools/marco-de-captura.html?ancho=390&alto=<ALTO>&pagina=/index.html"
      sips -c <ALTO> 390 <SALIDA>.png --out <RECORTADA>.png

  El marco va CENTRADO para que el recorte del centro caiga justo sobre él.
  Y tiene que servirse del MISMO origen que la página: si no, el navegador no
  deja mirar adentro del marco para medir.

  🔴 SEGUNDA TRAMPA DEL MISMO INSTRUMENTO, MEDIDA EL 30-sep-2026: LA PRIMERA
  CAPTURA DE UNA PÁGINA NO ES REPRODUCIBLE.

  Las tipografías vienen de fonts.googleapis.com, o sea de la red. En la
  primera corrida sobre una página pueden no llegar a tiempo y el texto se
  dibuja con la de reserva —Georgia en lugar de Marcellus, que es más ancha—,
  así que un título de dos líneas sale de tres y TODO lo que está abajo se
  corre. De la segunda corrida en adelante la fuente ya está en caché y la
  captura se estabiliza.

  Es el mismo modo de falla que el del ancho de ventana y es peor de cazar: no
  da error, la foto se ve perfecta, y comparada contra otra foto acusa un
  cambio que nunca ocurrió. Pasó así: una mudanza de CSS pareció mover el
  título del tablero 08, y el valor computado decía que el título medía
  exactamente lo mismo antes y después.

  LA REGLA QUE SE SIGUE: para comparar dos capturas, se toma una de descarte
  de cada archivo ANTES de las que se van a comparar. Y si una foto y una
  medición se contradicen, GANA LA MEDICIÓN.
-->

<style>
  html, body { margin: 0; padding: 0; background: #8C8C8C; }
  iframe { display: block; border: 0; margin: 0 auto; }
</style>
</head>
<body>

<iframe id="marco" title="El sitio"></iframe>

<script>
  const parametros = new URLSearchParams( location.search );
  const marco = document.getElementById( 'marco' );

  marco.style.width = ( parametros.get( 'ancho' ) || 390 ) + 'px';
  marco.style.height = ( parametros.get( 'alto' ) || 600 ) + 'px';
  marco.src = parametros.get( 'pagina' ) || '/index.html';

  // `mostrar=<id de la sección>` — agregado el 30-sep-2026.
  //
  // POR QUÉ HACE FALTA: los seis pasos de `reservar.html` viven en UNA sola
  // página y cinco están con `hidden`, así que sin esto el marco sólo puede
  // fotografiar la primera. La salida hasta hoy era copiar el markup de la
  // pantalla a un archivo de chequeo aparte — y esa copia envejece sola: el
  // día que el sitio cambia, la foto sigue mostrando la versión vieja sin
  // avisar. Esto fotografía SIEMPRE el archivo que anda.
  marco.addEventListener( 'load', function () {
    const cual = parametros.get( 'mostrar' );

    if ( !cual ) {
      return;
    }

    const adentro = marco.contentDocument;

    adentro.querySelectorAll( 'section[id^="paso-"]' ).forEach( function ( seccion ) {
      seccion.hidden = seccion.id !== cual;
    } );
  } );
</script>

</body>
</html>
