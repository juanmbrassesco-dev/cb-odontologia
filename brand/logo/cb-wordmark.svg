<?xml version="1.0" encoding="UTF-8"?>

<!--
  Wordmark (versión principal, sitio web) — CB Odontología y Estética.

  ⚠ EL TEXTO TODAVÍA ES TEXTO, no contornos. Este archivo se ve bien sólo donde
  Marcellus y Jost Light estén instaladas. Para imprenta hay que pasarlo a curvas:
  ahí las letras dejan de ser letras y pasan a ser dibujos, y el archivo deja de
  depender de nada. Las tipografías están en `brand/`, con su licencia OFL.

  Las coordenadas salieron de medir el render de `brand/logo-cb.html` y están
  verificadas contra él: el desvío es de 0,00 a 0,03 px. El porqué de cada
  número, y por qué las líneas base están corregidas, en `logo-cb-vector.html`.
-->

<svg
  viewBox="0 0 254.34375 54"
  width="254.34375"
  height="54"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="CB Odontología y Estética"
>

  <text
    x="0"
    y="45.7513"
    font-family="Marcellus, Georgia, serif"
    font-size="54"
    fill="#33322F"
  >CB</text>

  <rect
    x="84.484375"
    y="8"
    width="1"
    height="38"
    fill="#D9CBAA"
  />

  <!-- El nombre va en MAYÚSCULAS de verdad, no con `text-transform`: eso
       es una instrucción de CSS y acá no hay CSS que la aplique. -->
  <text
    x="104.078125"
    y="21.2005"
    font-family="Jost, 'Helvetica Neue', Arial, sans-serif"
    font-size="15.6"
    font-weight="300"
    letter-spacing="0.24em"
    fill="#8C8880"
  >ODONTOLOGÍA</text>

  <text
    x="104.078125"
    y="43.4974"
    font-family="Jost, 'Helvetica Neue', Arial, sans-serif"
    font-size="15.6"
    font-weight="300"
    letter-spacing="0.24em"
    fill="#8C8880"
  >Y ESTÉTICA</text>

</svg>
