<body>
  <main>
<section class="paso dia-hora" id="paso-dia-hora">

      <h1>¿Qué día y a qué hora?</h1>

      <!--
        LA LÍNEA DE AYUDA VIENE DEL TABLERO 19 Y FALTABA. Sin ella el almanaque
        muestra días de tres colores distintos y nada dice qué significan: el
        punto dorado y el gris son la única diferencia entre «acá hay lugar» y
        «acá no», y un color sin leyenda es una adivinanza.
      -->
      <p class="ayuda-pantalla">Los días en gris no tienen lugar. Tocá uno con
      punto dorado y elegí el horario.</p>

      <div class="campo" id="profesional-campo">
        <label class="etiqueta" for="profesional">¿Con quién?</label>
        <select class="caja" id="profesional"></select>
      </div>

      <!--
        EL ALMANAQUE Y LA GRILLA — mudados del tablero 19 el 30-sep-2026.

        🔴 ACÁ NO HAY NI UN DÍA NI UNA HORA ESCRITOS, y esa es la diferencia
        con el tablero: allá están tipeados para poder mirarlos, y acá los
        pinta `js/dia-hora.js` con lo que conteste el portero. Lo que se mudó
        del tablero es la FORMA —qué cajas hay y cómo se ven—, que es lo que
        se aprobó; los datos nunca fueron parte de eso.

        LAS DOS MITADES Y EL ANCLA QUE LAS UNE. En el teléfono el mes ocupa
        ~400 px y las horas ~372: no entran juntas en una pantalla de 745, así
        que cada día es un <a href="#horarios"> y tocarlo BAJA a la grilla en
        vez de abrir nada. En escritorio (1280) la clase `juntas` las pone una
        al lado de la otra y el ancla no tiene nada que hacer, porque las dos
        ya están a la vista.

        `.horarios` arranca con `hidden` porque hasta que no se elige un día no
        hay ninguna hora que mostrar, y una grilla vacía con un título encima
        se lee como «no hay turnos» en lugar de «todavía no elegiste».
      -->
      <div class="reserva juntas">

        <div class="almanaque" id="almanaque"></div>

        <section class="lado horarios" id="horarios" tabindex="-1" hidden>

          <p class="cuando" id="dia-hora-cuando"></p>

          <div class="grilla" id="grilla-de-horas"></div>

        </section>

      </div>

      <div class="acciones acciones-fila">
        <button class="btn btn-1" id="dia-hora-continuar">Continuar</button>

        <button class="btn btn-2" id="dia-hora-atras">Atrás</button>
      </div>

    </section>
  </main>

  // ── EL PEDIDO AL PORTERO, INTERCEPTADO ──
  //
  // Se reemplaza `fetch` en vez de llamar a `dibujarElAlmanaque()` con datos
  // puestos a mano, y la diferencia importa: así corre el camino ENTERO —armar
  // la consulta, leer la respuesta, filtrar por día y dibujar—. Saltearse el
  // pedido dejaría sin probar justo la parte que más se toca.
  const fetchDeVerdad = window.fetch;

  window.fetch = async function ( direccion ) {

    if ( String( direccion ).includes( 'horarios-disponibles' ) ) {

      const pedido = new URL( direccion );
      const desde = pedido.searchParams.get( 'desde' );
      const hasta = pedido.searchParams.get( 'hasta' );

      // Se recorta igual que lo haría el portero: la pantalla pide un mes y
      // tiene que recibir un mes, no los dos.
      const dias = AGENDA.filter( ( dia ) => dia.fecha >= desde && dia.fecha <= hasta );

      return {
        ok: true,
        json: async () => ( { dias: dias } )
      };
    }

    return fetchDeVerdad( direccion );
  };
